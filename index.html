<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Kelas 12 B</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & print utility */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white;
                color: black;
            }
        }
        .touch-action-manipulation {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen pb-12">

    <!-- Header App -->
    <header class="bg-gradient-to-r from-teal-700 via-teal-600 to-cyan-700 text-white shadow-lg sticky top-0 z-30 no-print">
        <div class="max-w-4xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="bg-white/20 p-2.5 rounded-xl backdrop-blur-md">
                    <i class="fa-solid fa-user-check text-2xl text-teal-100"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Absensi Kelas 12 B</h1>
                    <p class="text-xs text-teal-100 flex items-center gap-1.5 mt-0.5">
                        <i class="fa-regular fa-clock"></i> <span id="clockDisplay">Memuat waktu...</span>
                    </p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button onclick="resetDataConfirmation()" class="px-3 py-1.5 text-xs font-medium bg-red-500/20 hover:bg-red-500/30 text-red-100 rounded-lg transition border border-red-300/30 flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-rotate-left"></i> Reset Presensi
                </button>
            </div>
        </div>
    </header>

    <!-- Header untuk Hasil Cetak (Print PDF) -->
    <div class="hidden print-only p-6 border-b border-gray-300 mb-4">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-900">LAPORAN KEHADIRAN KELAS 12 B</h1>
            <p class="text-sm text-gray-600 mt-1" id="printMetaInfo">Tanggal: - | Mata Pelajaran: -</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 mt-6 space-y-6">

        <!-- Form Filter & Informasi Kelas -->
        <section class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80 no-print">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="attendanceDate" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                        <i class="fa-regular fa-calendar-days text-teal-600 mr-1"></i> Tanggal Presensi
                    </label>
                    <input type="date" id="attendanceDate" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:outline-none transition">
                </div>
                <div>
                    <label for="subjectName" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">
                        <i class="fa-solid fa-book-bookmark text-teal-600 mr-1"></i> Mata Pelajaran / Jam Ke
                    </label>
                    <input type="text" id="subjectName" placeholder="Contoh: Matematika (Jam 1-2)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-medium focus:ring-2 focus:ring-teal-500 focus:outline-none transition" value="Pelajaran Umum">
                </div>
            </div>
        </section>

        <!-- Widget Rekapitulasi Status (Real-time) -->
        <section class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
            <div class="bg-emerald-50/80 border border-emerald-200/60 rounded-2xl p-3.5 sm:p-4 flex items-center justify-between shadow-sm">
                <div>
                    <span class="text-xs font-semibold text-emerald-700 uppercase tracking-wider">Hadir (H)</span>
                    <div class="text-2xl sm:text-3xl font-extrabold text-emerald-800 mt-0.5" id="countHadir">0</div>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-600 font-bold text-lg">
                    H
                </div>
            </div>

            <div class="bg-amber-50/80 border border-amber-200/60 rounded-2xl p-3.5 sm:p-4 flex items-center justify-between shadow-sm">
                <div>
                    <span class="text-xs font-semibold text-amber-700 uppercase tracking-wider">Izin (I)</span>
                    <div class="text-2xl sm:text-3xl font-extrabold text-amber-800 mt-0.5" id="countIzin">0</div>
                </div>
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-600 font-bold text-lg">
                    I
                </div>
            </div>

            <div class="bg-blue-50/80 border border-blue-200/60 rounded-2xl p-3.5 sm:p-4 flex items-center justify-between shadow-sm">
                <div>
                    <span class="text-xs font-semibold text-blue-700 uppercase tracking-wider">Sakit (S)</span>
                    <div class="text-2xl sm:text-3xl font-extrabold text-blue-800 mt-0.5" id="countSakit">0</div>
                </div>
                <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-600 font-bold text-lg">
                    S
                </div>
            </div>

            <div class="bg-rose-50/80 border border-rose-200/60 rounded-2xl p-3.5 sm:p-4 flex items-center justify-between shadow-sm">
                <div>
                    <span class="text-xs font-semibold text-rose-700 uppercase tracking-wider">Alpa (A)</span>
                    <div class="text-2xl sm:text-3xl font-extrabold text-rose-800 mt-0.5" id="countAlpa">0</div>
                </div>
                <div class="w-10 h-10 rounded-xl bg-rose-500/10 flex items-center justify-center text-rose-600 font-bold text-lg">
                    A
                </div>
            </div>
        </section>

        <!-- Baris Kontrol Cepat & Tambah Siswa -->
        <section class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 no-print">
            <div class="flex items-center gap-2">
                <button onclick="setAllStatus('H')" class="px-3 py-1.5 text-xs font-semibold bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded-lg transition active:scale-95">
                    <i class="fa-solid fa-check"></i> Semua Hadir
                </button>
                <button onclick="clearAllStatus()" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition active:scale-95">
                    Kosongkan
                </button>
            </div>
            
            <button onclick="openAddStudentModal()" class="w-full sm:w-auto px-4 py-2 text-xs font-bold text-teal-700 bg-teal-50 hover:bg-teal-100 border border-teal-200 rounded-xl transition flex items-center justify-center gap-2 active:scale-95">
                <i class="fa-solid fa-user-plus"></i> Tambah Siswa Baru
            </button>
        </section>

        <!-- Daftar Siswa -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <h2 class="font-bold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-users text-teal-600"></i> Daftar Siswa (<span id="totalStudentCount">0</span>)
                </h2>
                <span class="text-xs text-slate-400 no-print">Pilih status kehadiran</span>
            </div>

            <!-- List Siswa (Rendered via JS) -->
            <div id="studentListContainer" class="divide-y divide-slate-100">
                <!-- Data siswa akan dimuat di sini -->
            </div>
        </section>

        <!-- Action Buttons (Simpan & Ekspor) -->
        <section class="flex flex-col sm:flex-row items-center gap-3 pt-2 no-print">
            <button onclick="saveAttendance()" class="w-full sm:flex-1 py-3.5 px-6 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl shadow-lg shadow-teal-600/20 active:scale-[0.99] transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Simpan Data Presensi
            </button>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="exportToCSV()" class="flex-1 sm:flex-none py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md active:scale-[0.99] transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-file-csv"></i> Unduh CSV
                </button>
                <button onclick="printAttendance()" class="flex-1 sm:flex-none py-3.5 px-4 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl shadow-md active:scale-[0.99] transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-print"></i> Cetak / PDF
                </button>
            </div>
        </section>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 no-print">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage" class="text-sm font-medium">Pesan notifikasi</span>
    </div>

    <!-- Modal Tambah Siswa -->
    <div id="addStudentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden px-4 no-print">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0" id="modalCard">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">Tambah Siswa Baru</h3>
                <button onclick="closeAddStudentModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="addStudentForm" onsubmit="handleAddStudent(event)" class="space-y-4">
                <div>
                    <label for="newStudentName" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Nama Lengkap Siswa</label>
                    <input type="text" id="newStudentName" placeholder="Masukkan nama siswa..." required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
                </div>
                <div>
                    <label for="newStudentGender" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Jenis Kelamin</label>
                    <select id="newStudentGender" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none">
                        <option value="L">Laki-laki (L)</option>
                        <option value="P">Perempuan (P)</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddStudentModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Batal</button>
                    <button type="submit" class="px-4 py-2 text-xs font-bold text-white bg-teal-600 hover:bg-teal-700 rounded-xl transition shadow-md">Simpan Siswa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logika Absensi -->
    <script>
        // Data default Siswa Kelas 12 B
        const defaultStudents = [
            { id: 1, name: "Achmad Farhan", gender: "L" },
            { id: 2, name: "Adinda Putri Rahayu", gender: "P" },
            { id: 3, name: "Bagus Setiawan", gender: "L" },
            { id: 4, name: "Bintang Pamungkas", gender: "L" },
            { id: 5, name: "Cantika Dewi", gender: "P" },
            { id: 6, name: "Daffa Al-Ghazali", gender: "L" },
            { id: 7, name: "Dina Maria", gender: "P" },
            { id: 8, name: "Fajar Ramadan", gender: "L" },
            { id: 9, name: "Gilang Permana", gender: "L" },
            { id: 10, name: "Indah Lestari", gender: "P" },
            { id: 11, name: "Kevin Sanjaya", gender: "L" },
            { id: 12, name: "Larasati Anggraini", gender: "P" },
            { id: 13, name: "Muhammad Rizky", gender: "L" },
            { id: 14, name: "Nabila Maharani", gender: "P" },
            { id: 15, name: "Pratama Arhan", gender: "L" }
        ];

        let students = [];
        let attendanceState = {}; // Storage format: { studentId: 'H'|'I'|'S'|'A'|'' }

        // Inisialisasi saat Halaman Dimuat
        window.onload = function() {
            // Set tanggal default ke hari ini
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('attendanceDate').value = today;

            // Update Jam Otomatis
            updateClock();
            setInterval(updateClock, 1000);

            // Muat Siswa & Presensi dari LocalStorage jika ada
            loadInitialData();
        };

        // Update Waktu Realtime
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('clockDisplay').textContent = now.toLocaleDateString('id-ID', options);
        }

        // Muat Data Awal
        function loadInitialData() {
            const savedStudents = localStorage.getItem('class_12b_students');
            if (savedStudents) {
                students = JSON.parse(savedStudents);
            } else {
                students = [...defaultStudents];
                localStorage.setItem('class_12b_students', JSON.stringify(students));
            }

            // Load saved attendance for current date if exists
            const date = document.getElementById('attendanceDate').value;
            const savedAttendance = localStorage.getItem(`class_12b_attendance_${date}`);
            if (savedAttendance) {
                const parsed = JSON.parse(savedAttendance);
                attendanceState = parsed.status || {};
                if(parsed.subject) document.getElementById('subjectName').value = parsed.subject;
            } else {
                attendanceState = {};
            }

            renderStudents();
            updateSummary();
        }

        // Render List Siswa
        function renderStudents() {
            const container = document.getElementById('studentListContainer');
            document.getElementById('totalStudentCount').textContent = students.length;
            container.innerHTML = '';

            if (students.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400">Belum ada data siswa. Klik "Tambah Siswa Baru".</div>`;
                return;
            }

            students.forEach((student, index) => {
                const status = attendanceState[student.id] || '';
                
                const item = document.createElement('div');
                item.className = 'p-3.5 sm:p-4 hover:bg-slate-50 transition flex flex-col sm:flex-row sm:items-center justify-between gap-3';
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 text-center text-xs font-bold text-slate-400">${index + 1}</span>
                        <div>
                            <div class="font-semibold text-slate-800 text-sm sm:text-base">${student.name}</div>
                            <span class="inline-block px-2 py-0.5 text-[10px] font-semibold rounded bg-slate-100 text-slate-500">
                                ${student.gender === 'L' ? 'Laki-laki' : 'Perempuan'}
                            </span>
                        </div>
                    </div>
                    
                    <!-- Pilihan Status Touch-Friendly -->
                    <div class="flex items-center gap-1.5 sm:gap-2 self-end sm:self-auto w-full sm:w-auto justify-end">
                        <button type="button" onclick="setStatus(${student.id}, 'H')" 
                            class="touch-action-manipulation flex-1 sm:flex-none w-11 h-10 sm:w-12 sm:h-10 rounded-xl font-bold text-sm transition flex items-center justify-center border ${
                                status === 'H' 
                                ? 'bg-emerald-600 text-white border-emerald-600 shadow-md scale-105' 
                                : 'bg-white text-emerald-700 border-slate-200 hover:bg-emerald-50'
                            }">
                            H
                        </button>
                        <button type="button" onclick="setStatus(${student.id}, 'I')" 
                            class="touch-action-manipulation flex-1 sm:flex-none w-11 h-10 sm:w-12 sm:h-10 rounded-xl font-bold text-sm transition flex items-center justify-center border ${
                                status === 'I' 
                                ? 'bg-amber-500 text-white border-amber-500 shadow-md scale-105' 
                                : 'bg-white text-amber-600 border-slate-200 hover:bg-amber-50'
                            }">
                            I
                        </button>
                        <button type="button" onclick="setStatus(${student.id}, 'S')" 
                            class="touch-action-manipulation flex-1 sm:flex-none w-11 h-10 sm:w-12 sm:h-10 rounded-xl font-bold text-sm transition flex items-center justify-center border ${
                                status === 'S' 
                                ? 'bg-blue-600 text-white border-blue-600 shadow-md scale-105' 
                                : 'bg-white text-blue-600 border-slate-200 hover:bg-blue-50'
                            }">
                            S
                        </button>
                        <button type="button" onclick="setStatus(${student.id}, 'A')" 
                            class="touch-action-manipulation flex-1 sm:flex-none w-11 h-10 sm:w-12 sm:h-10 rounded-xl font-bold text-sm transition flex items-center justify-center border ${
                                status === 'A' 
                                ? 'bg-rose-600 text-white border-rose-600 shadow-md scale-105' 
                                : 'bg-white text-rose-600 border-slate-200 hover:bg-rose-50'
                            }">
                            A
                        </button>
                        <button type="button" onclick="deleteStudent(${student.id})" class="no-print ml-2 text-slate-300 hover:text-rose-500 p-2 transition" title="Hapus Siswa">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Set Status Per Siswa
        function setStatus(id, code) {
            if (attendanceState[id] === code) {
                delete attendanceState[id]; // Toggle off jika ditekan ulang
            } else {
                attendanceState[id] = code;
            }
            renderStudents();
            updateSummary();
        }

        // Set Semua Siswa ke Status Tertentu
        function setAllStatus(code) {
            students.forEach(s => {
                attendanceState[s.id] = code;
            });
            renderStudents();
            updateSummary();
            showToast(`Semua siswa di-set ${code === 'H' ? 'Hadir' : code}`);
        }

        // Kosongkan Semua Pilihan Status
        function clearAllStatus() {
            attendanceState = {};
            renderStudents();
            updateSummary();
            showToast("Pilihan presensi telah dikosongkan");
        }

        // Update Rekapitulasi Realtime
        function updateSummary() {
            let h = 0, i = 0, s = 0, a = 0;
            Object.values(attendanceState).forEach(val => {
                if (val === 'H') h++;
                if (val === 'I') i++;
                if (val === 'S') s++;
                if (val === 'A') a++;
            });

            document.getElementById('countHadir').textContent = h;
            document.getElementById('countIzin').textContent = i;
            document.getElementById('countSakit').textContent = s;
            document.getElementById('countAlpa').textContent = a;
        }

        // Simpan Data Ke LocalStorage
        function saveAttendance() {
            const date = document.getElementById('attendanceDate').value;
            const subject = document.getElementById('subjectName').value;

            if (!date) {
                showToast("Harap pilih tanggal terlebih dahulu!", "error");
                return;
            }

            const payload = {
                date: date,
                subject: subject,
                status: attendanceState,
                updatedAt: new Date().toISOString()
            };

            localStorage.setItem(`class_12b_attendance_${date}`, JSON.stringify(payload));
            showToast("Presensi berhasil disimpan ke memori lokal!");
        }

        // Reset Data Presensi Harian
        function resetDataConfirmation() {
            if (confirm("Apakah Anda yakin ingin mengosongkan semua isian presensi untuk hari ini?")) {
                attendanceState = {};
                renderStudents();
                updateSummary();
                showToast("Data presensi berhasil direset");
            }
        }

        // Modal Handlers (Tambah Siswa Baru)
        function openAddStudentModal() {
            const modal = document.getElementById('addStudentModal');
            const card = document.getElementById('modalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeAddStudentModal() {
            const modal = document.getElementById('addStudentModal');
            const card = document.getElementById('modalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function handleAddStudent(e) {
            e.preventDefault();
            const nameInput = document.getElementById('newStudentName');
            const genderInput = document.getElementById('newStudentGender');

            const newStudent = {
                id: Date.now(),
                name: nameInput.value.trim(),
                gender: genderInput.value
            };

            students.push(newStudent);
            // Sort nama secara alfabetis
            students.sort((a, b) => a.name.localeCompare(b.name));

            localStorage.setItem('class_12b_students', JSON.stringify(students));
            
            nameInput.value = '';
            closeAddStudentModal();
            renderStudents();
            showToast("Siswa baru berhasil ditambahkan!");
        }

        // Hapus Siswa dari Daftar
        function deleteStudent(id) {
            const student = students.find(s => s.id === id);
            if (confirm(`Hapus ${student.name} dari daftar siswa?`)) {
                students = students.filter(s => s.id !== id);
                delete attendanceState[id];
                localStorage.setItem('class_12b_students', JSON.stringify(students));
                renderStudents();
                updateSummary();
                showToast("Siswa berhasil dihapus");
            }
        }

        // Ekspor ke CSV
        function exportToCSV() {
            const date = document.getElementById('attendanceDate').value;
            const subject = document.getElementById('subjectName').value || 'Pelajaran';

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += `REKAP PRESENSI KELAS 12 B\n`;
            csvContent += `Tanggal,${date}\n`;
            csvContent += `Mata Pelajaran,${subject}\n\n`;
            csvContent += `No,Nama Siswa,JK,Status Kehadiran\n`;

            students.forEach((student, idx) => {
                const st = attendanceState[student.id] || '-';
                let statusLabel = '-';
                if (st === 'H') statusLabel = 'Hadir';
                if (st === 'I') statusLabel = 'Izin';
                if (st === 'S') statusLabel = 'Sakit';
                if (st === 'A') statusLabel = 'Alpa';
                
                csvContent += `${idx + 1},"${student.name}",${student.gender},${statusLabel}\n`;
            });

            // Summary
            let h = document.getElementById('countHadir').textContent;
            let i = document.getElementById('countIzin').textContent;
            let s = document.getElementById('countSakit').textContent;
            let a = document.getElementById('countAlpa').textContent;
            
            csvContent += `\nREKAPITULASI\nHadir,${h}\nIzin,${i}\nSakit,${s}\nAlpa,${a}\n`;

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Absensi_12B_${date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showToast("File CSV berhasil diunduh!");
        }

        // Cetak atau Simpan Ke PDF
        function printAttendance() {
            const date = document.getElementById('attendanceDate').value;
            const subject = document.getElementById('subjectName').value;
            document.getElementById('printMetaInfo').textContent = `Tanggal: ${date} | Mata Pelajaran / Catatan: ${subject || '-'}`;
            window.print();
        }

        // Helper Toast Notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-exclamation text-rose-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Reload data saat tanggal diubah
        document.getElementById('attendanceDate').addEventListener('change', loadInitialData);
    </script>
</body>
</html>
